name: Test Android App

on:
  push:
  workflow_call:
    secrets:
      WORKSPACE_KEY:
        required: true

permissions:
  contents: read
  actions: read

env :
  SURVICATE_SDK: survicate_sdk.tgz
  SURVICATE: survicate
  ANDROID_APK: app-release.apk
  ANDROID: android-apk

jobs:
  build-react-native-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install Dependencies 
        run: |
          yarn

      - name: Generate Tarball
        run: |
          npm pack
          TARBALL_NAME=$(ls *.tgz)
          mv $TARBALL_NAME test/react_native/${{ env.SURVICATE_SDK }}

      - name: Upload Survicate SDK Tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.SURVICATE }}
          path: test/react_native/${{ env.SURVICATE_SDK }}

  build-android-app:
    runs-on: ubuntu-latest
    needs: build-react-native-sdk
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Download Survicate SDK Tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.SURVICATE }}
          path: test/react_native

      - name: Install Test App Dependencies
        working-directory: test/react_native
        run: |
          yarn
          yarn add ./${{ env.SURVICATE_SDK }}

      - name: Setup Workspace Key
        working-directory: test/react_native
        env:
          WORKSPACE_KEY: ${{ secrets.WORKSPACE_KEY }}
        run: |
          echo "WORKSPACE_KEY=$WORKSPACE_KEY" > .env

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Setup Android
        working-directory: test/react_native/android
        run: chmod +x gradlew    

      - name: Build APK
        working-directory: test/react_native/android
        run: |
          ./gradlew app:assembleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ANDROID }}
          path: test/react_native/android/app/build/outputs/apk/release/${{ env.ANDROID_APK }}

   
  run-android-tests:
    runs-on: ubuntu-latest
    needs: build-android-app
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Maestro
        run: |
          curl -Ls --retry 3 --retry-all-errors "https://get.maestro.mobile.dev" | bash
          echo "${HOME}/.maestro/bin" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.ANDROID }}

      - name: Run tests on emulator
        # Pin to a full commit SHA (supply-chain hardening, see ITS-61)
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            adb install -r ${{ env.ANDROID_APK }}
            maestro test .maestro/test-show-survey.yaml --format junit
    